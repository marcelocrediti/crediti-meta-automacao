<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FDCA01" />
  <title>Automação Crediti</title>
  <style>
    :root{--yellow:#FDCA01;--ink:#151515;--muted:#6d6d6d;--bg:#f4f5f7;--card:#fff;--line:#e7e7e7;--danger:#c62828;--green:#198754}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .app{max-width:860px;margin:auto;min-height:100vh;padding:18px 16px 90px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;font-size:30px;box-shadow:0 8px 24px rgba(253,202,1,.32)}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:14px}.btn-primary{background:var(--yellow);color:#111}.btn-light{background:#fff;border:1px solid var(--line)}.btn-danger{background:#fff1f1;color:var(--danger)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 10px}.section-title h2{font-size:17px;margin:0}.search{width:190px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none}
    .list{display:grid;gap:10px}.campaign{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:850;font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{background:#f5f5f5;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.message{color:#3d3d3d;font-size:14px;line-height:1.45;white-space:pre-line;max-height:62px;overflow:hidden}.url{font-size:12px;color:#555;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mini{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:750;cursor:pointer}.switch{width:46px;height:26px;border-radius:99px;background:#d7d7d7;position:relative;cursor:pointer;flex:0 0 auto}.switch::after{content:"";width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}.switch.on{background:var(--green)}.switch.on::after{left:23px}
    .empty{text-align:center;background:#fff;border:1px dashed #ccc;border-radius:16px;padding:32px;color:var(--muted)}
    .fab{position:fixed;right:18px;bottom:20px;border:0;background:var(--yellow);color:#111;border-radius:18px;padding:15px 18px;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.18);cursor:pointer}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}.grab{width:46px;height:5px;background:#ddd;border-radius:99px;margin:0 auto 14px}.sheet h3{font-size:20px;margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #d9d9d9;border-radius:12px;padding:13px;font:inherit;outline:none;background:#fff}.field textarea{min-height:120px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:5px}.form-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;display:none;z-index:30}.toast.show{display:block}
    @media(max-width:560px){.top{align-items:flex-start}.top>.btn{display:none}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:19px}.search{width:145px}.app{padding:14px 12px 90px}.brand h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><div class="logo">⚡</div><div><h1>Automação Crediti</h1><p>Campanhas do Instagram em um só lugar</p></div></div>
      <button class="btn btn-primary" onclick="openNew()">+ Nova campanha</button>
    </header>

    <section class="stats">
      <div class="stat"><b id="total">0</b><span>Campanhas</span></div>
      <div class="stat"><b id="active">0</b><span>Ativas</span></div>
      <div class="stat"><b id="paused">0</b><span>Pausadas</span></div>
    </section>

    <div class="section-title"><h2>Suas campanhas</h2><input id="search" class="search" placeholder="Buscar" oninput="render()" /></div>
    <section id="list" class="list"><div class="empty">Carregando campanhas...</div></section>
  </main>

  <button class="fab" onclick="openNew()">+ Nova campanha</button>

  <div id="modal" class="modal" onclick="closeByBackdrop(event)">
    <div class="sheet">
      <div class="grab"></div>
      <h3 id="formTitle">Nova campanha</h3>
      <input id="campaignId" type="hidden" />
      <div class="field"><label>Nome da campanha</label><input id="name" placeholder="Ex.: FGTS Setembro" /></div>
      <div class="field"><label>Palavras-chave</label><input id="keywords" placeholder="Ex.: FGTS, antecipação, saque" /><div class="hint">Separe as palavras por vírgula. Pode colocar quantas quiser.</div></div>
      <div class="field"><label>Mensagem automática</label><textarea id="message" placeholder="Escreva exatamente o que o cliente vai receber no Direct."></textarea></div>
      <div class="field"><label>Link ou PDF opcional</label><input id="url" placeholder="https://..." /></div>
      <div class="field"><label><input id="activeInput" type="checkbox" checked /> Campanha ativa</label></div>
      <div class="form-actions"><button class="btn btn-light" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCampaign()">Salvar campanha</button></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API='/.netlify/functions/campaigns';
    let campaigns=[];

    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

    async function load(){
      try{const r=await fetch(API);const data=await r.json();campaigns=data.campaigns||[];render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">Não foi possível carregar agora.</div>'}
    }

    function render(){
      const q=document.getElementById('search').value.trim().toLowerCase();
      const filtered=campaigns.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.keywords||[]).join(' ').toLowerCase().includes(q));
      document.getElementById('total').textContent=campaigns.length;
      document.getElementById('active').textContent=campaigns.filter(c=>c.active).length;
      document.getElementById('paused').textContent=campaigns.filter(c=>!c.active).length;
      const list=document.getElementById('list');
      if(!filtered.length){list.innerHTML='<div class="empty">Nenhuma campanha encontrada.</div>';return}
      list.innerHTML=filtered.map(c=>`<article class="campaign">
        <div class="row"><div class="title">${esc(c.name)}</div><div class="switch ${c.active?'on':''}" onclick="toggle('${c.id}')" title="Ativar ou pausar"></div></div>
        <div class="chips">${(c.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>
        <div class="message">${esc(c.message)}</div>
        ${c.url?`<div class="url">🔗 ${esc(c.url)}</div>`:''}
        <div class="actions"><button class="mini" onclick="edit('${c.id}')">Editar</button><button class="mini" onclick="duplicate('${c.id}')">Duplicar</button><button class="mini" onclick="removeCampaign('${c.id}')">Excluir</button></div>
      </article>`).join('')
    }

    function openNew(){
      document.getElementById('formTitle').textContent='Nova campanha';
      document.getElementById('campaignId').value='';document.getElementById('name').value='';document.getElementById('keywords').value='';document.getElementById('message').value='';document.getElementById('url').value='';document.getElementById('activeInput').checked=true;document.getElementById('modal').classList.add('show')
    }
    function edit(id){const c=campaigns.find(x=>x.id===id);if(!c)return;document.getElementById('formTitle').textContent='Editar campanha';document.getElementById('campaignId').value=c.id;document.getElementById('name').value=c.name;document.getElementById('keywords').value=(c.keywords||[]).join(', ');document.getElementById('message').value=c.message;document.getElementById('url').value=c.url||'';document.getElementById('activeInput').checked=!!c.active;document.getElementById('modal').classList.add('show')}
    function closeModal(){document.getElementById('modal').classList.remove('show')}
    function closeByBackdrop(e){if(e.target.id==='modal')closeModal()}

    async function saveCampaign(){
      const body={id:document.getElementById('campaignId').value||undefined,name:document.getElementById('name').value.trim(),keywords:document.getElementById('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),message:document.getElementById('message').value.trim(),url:document.getElementById('url').value.trim(),active:document.getElementById('activeInput').checked};
      if(!body.name||!body.keywords.length||!body.message){toast('Preencha nome, palavra-chave e mensagem');return}
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){toast(data.error||'Não foi possível salvar');return}closeModal();toast('Campanha salva');await load()
    }

    async function toggle(id){const c=campaigns.find(x=>x.id===id);if(!c)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...c,active:!c.active})});await load()}
    async function duplicate(id){const c=campaigns.find(x=>x.id===id);if(!c)return;const copy={...c,id:undefined,name:c.name+' - cópia'};await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(copy)});toast('Campanha duplicada');await load()}
    async function removeCampaign(id){if(!confirm('Excluir esta campanha?'))return;await fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE'});toast('Campanha excluída');await load()}

    load();
  </script>
</body>
</html>
