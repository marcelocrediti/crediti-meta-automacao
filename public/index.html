<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDCA01">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Automação Crediti">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Automação Crediti</title>
<style>
:root{--y:#FDCA01;--ink:#171717;--muted:#6b6b6b;--bg:#f5f6f8;--line:#e3e3e3;--green:#198754}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;max-width:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;width:100%;max-width:100%;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;touch-action:pan-y}
html.locked,html.locked body{overflow:hidden}
button,input,textarea{font:inherit}
.app{width:100%;max-width:430px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 10px calc(82px + env(safe-area-inset-bottom));min-height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:10px}.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:12px;overflow:hidden;background:#171717}.logo img{display:block;width:100%;height:100%}.brandcopy{min-width:0}.brand h1{margin:0;font-size:18px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:3px 0 0;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .primary{display:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}.stat{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}.stat b{display:block;font-size:17px;line-height:1}.stat span{display:block;margin-top:4px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}.head h2{margin:0;font-size:14px;white-space:nowrap}.search{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;outline:none;font-size:13px}
.list{display:grid;gap:8px;min-width:0}.card{width:100%;min-width:0;max-width:100%;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.row{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:8px;min-width:0}.title{min-width:0;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.switch{width:40px;height:23px;padding:0;border:0;border-radius:99px;background:#d4d4d4;position:relative;justify-self:end}.switch:after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003}.switch.on{background:var(--green)}.switch.on:after{left:20px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;max-width:100%;overflow:hidden}.chip{max-width:100%;background:#f3f3f3;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.msg{max-width:100%;font-size:12px;line-height:1.38;color:#3f3f3f;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}.url{display:block;max-width:100%;margin-top:8px;font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.mini{min-width:0;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:14px;background:var(--y);padding:12px 14px;font-size:12px;font-weight:900;box-shadow:0 8px 20px #0002;max-width:calc(100vw - 24px)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#0008;overflow:hidden}.modal.show{display:flex}.sheet{width:100%;max-width:430px;max-height:90dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:#fff;border-radius:20px 20px 0 0;padding:13px 12px calc(18px + env(safe-area-inset-bottom))}.grab{width:40px;height:4px;border-radius:8px;background:#ddd;margin:0 auto 11px}.sheet h3{margin:0 0 10px;font-size:17px}.field{margin:10px 0}.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:800}.field input,.field textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid #d8d8d8;border-radius:10px;background:#fff;padding:11px;font-size:13px;outline:none}.field textarea{min-height:92px;resize:vertical}.hint,.file-status{margin-top:5px;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.upload{border:1.5px dashed #c8c8c8;border-radius:12px;background:#fafafa;padding:11px}.upload input{padding:4px 0;border:0;background:transparent}.forms{display:grid;grid-template-columns:1fr 1.25fr;gap:7px;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 12px;font-size:12px;font-weight:800}.primary{background:var(--y);color:#111}.light{background:#fff;border:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:none;max-width:calc(100vw - 24px);background:#111;color:#fff;border-radius:10px;padding:9px 11px;font-size:11px;text-align:center}.toast.show{display:block}.empty{width:100%;overflow:hidden;text-align:center;background:#fff;border:1px dashed #ccc;border-radius:13px;padding:22px 10px;color:var(--muted);font-size:12px}
@media(min-width:700px){.app{max-width:760px;padding:18px}.sheet{max-width:620px}.top .primary{display:block;margin-left:auto}.fab{display:none}.brand h1{font-size:20px}.brand p{font-size:12px}.head h2{font-size:16px}.card{padding:14px}.msg{font-size:13px}.url{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand">
    <div class="logo"><img src="/icon.svg" alt="Automação Crediti"></div>
    <div class="brandcopy"><h1>Automação Crediti</h1><p>Campanhas do Instagram</p></div>
  </div>
  <button id="newCampaign" class="btn primary">+ Nova campanha</button>
</header>
<section class="stats">
  <div class="stat"><b id="total">0</b><span>Campanhas</span></div>
  <div class="stat"><b id="active">0</b><span>Ativas</span></div>
  <div class="stat"><b id="paused">0</b><span>Pausadas</span></div>
</section>
<div class="head"><h2>Suas campanhas</h2><input id="search" class="search" placeholder="Buscar"></div>
<section id="list" class="list"><div class="empty">Carregando campanhas...</div></section>
</main>
<button id="newCampaignFab" class="fab">+ Nova campanha</button>
<div id="modal" class="modal">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="formTitle">Nova campanha</h3>
    <input id="campaignId" type="hidden">
    <div class="field"><label>Nome da campanha</label><input id="name" placeholder="Ex.: FGTS Setembro"></div>
    <div class="field"><label>Palavras-chave</label><input id="keywords" placeholder="Ex.: FGTS, saque, antecipação"><div class="hint">Separe por vírgula. Pode colocar quantas quiser.</div></div>
    <div class="field"><label>Mensagem automática</label><textarea id="message" placeholder="Escreva o que vai chegar no Direct."></textarea></div>
    <div class="field"><label>Link opcional</label><input id="url" placeholder="Google Drive, site ou outro endereço"><div class="hint">Você pode usar um link externo ou subir o PDF abaixo.</div></div>
    <div class="field upload"><label>Subir PDF direto no Automação Crediti</label><input id="pdf" type="file" accept="application/pdf,.pdf"><div id="fileStatus" class="file-status">Nenhum PDF selecionado.</div></div>
    <div class="field"><label><input id="activeInput" type="checkbox" checked> Campanha ativa</label></div>
    <div class="forms"><button id="cancelBtn" class="btn light">Cancelar</button><button id="saveBtn" class="btn primary">Salvar campanha</button></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="/app.js" defer></script>
</body>
</html>
