<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDCA01">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Automação Crediti">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Automação Crediti</title>
<style>
:root{--y:#FDCA01;--ink:#171717;--muted:#6d6d6d;--bg:#f4f5f7;--line:#e5e5e5;--green:#198754;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:860px;margin:auto;min-height:100vh;padding:18px 16px 130px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:17px;background:#171717;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;display:block}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px}.primary{background:var(--y);color:#111}.light{background:#fff;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{font-size:18px;margin:0}.search{width:180px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:17px;font-weight:850}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{background:#f4f4f4;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.msg{font-size:14px;line-height:1.5;color:#404040;white-space:pre-line}.url{font-size:12px;margin-top:10px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mini{padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800}.switch{width:46px;height:26px;border-radius:99px;background:#d7d7d7;position:relative}.switch:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;background:#fff;border-radius:50%;box-shadow:0 2px 5px #0003}.switch.on{background:var(--green)}.switch.on:after{left:23px}.fab{position:fixed;right:18px;bottom:92px;background:var(--y);border:0;border-radius:18px;padding:16px 19px;font-weight:900;box-shadow:0 10px 28px #0003;z-index:10}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 30px}.grab{width:46px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 14px}.sheet h3{margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d8d8d8;border-radius:12px;font:inherit}.field textarea{min-height:115px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}.upload{border:1.5px dashed #c8c8c8;border-radius:14px;padding:14px;background:#fafafa}.upload input{border:0;padding:7px 0;background:transparent}.file-status{font-size:12px;margin-top:7px;color:var(--muted)}.forms{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:18px}.toast{position:fixed;left:50%;bottom:155px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;display:none;z-index:40}.toast.show{display:block}.empty{text-align:center;background:#fff;border:1px dashed #ccc;border-radius:16px;padding:30px;color:var(--muted)}
@media(max-width:560px){.top>.btn{display:none}.app{padding:14px 12px 130px}.search{width:145px}.stat{padding:12px}.stat b{font-size:19px}.brand h1{font-size:20px}}
</style>
</head>
<body>
<main class="app"><header class="top"><div class="brand"><div class="logo"><img src="/icon.svg" alt="Automação Crediti"></div><div><h1>Automação Crediti</h1><p>Campanhas do Instagram em um só lugar</p></div></div><button class="btn primary" onclick="openNew()">+ Nova campanha</button></header>
<section class="stats"><div class="stat"><b id="total">0</b><span>Campanhas</span></div><div class="stat"><b id="active">0</b><span>Ativas</span></div><div class="stat"><b id="paused">0</b><span>Pausadas</span></div></section>
<div class="head"><h2>Suas campanhas</h2><input id="search" class="search" placeholder="Buscar" oninput="render()"></div><section id="list" class="list"><div class="empty">Carregando campanhas...</div></section></main>
<button class="fab" onclick="openNew()">+ Nova campanha</button>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><div class="grab"></div><h3 id="formTitle">Nova campanha</h3><input id="campaignId" type="hidden">
<div class="field"><label>Nome da campanha</label><input id="name" placeholder="Ex.: FGTS Setembro"></div>
<div class="field"><label>Palavras-chave</label><input id="keywords" placeholder="Ex.: FGTS, saque, antecipação"><div class="hint">Separe por vírgula. Pode colocar quantas quiser.</div></div>
<div class="field"><label>Mensagem automática</label><textarea id="message" placeholder="Escreva o que vai chegar no Direct."></textarea></div>
<div class="field"><label>Link opcional</label><input id="url" placeholder="Cole um link do Google Drive, site ou outro endereço"><div class="hint">Você pode usar um link externo ou subir o PDF logo abaixo.</div></div>
<div class="field upload"><label>Subir PDF direto no Automação Crediti</label><input id="pdf" type="file" accept="application/pdf,.pdf"><div id="fileStatus" class="file-status">Nenhum PDF selecionado.</div></div>
<div class="field"><label><input id="activeInput" type="checkbox" checked> Campanha ativa</label></div>
<div class="forms"><button class="btn light" onclick="closeModal()">Cancelar</button><button id="saveBtn" class="btn primary" onclick="saveCampaign()">Salvar campanha</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='/.netlify/functions/campaigns', FILE_API='/.netlify/functions/campaign-file';let campaigns=[];
const $=id=>document.getElementById(id);function esc(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function load(){try{const r=await fetch(API),d=await r.json();campaigns=d.campaigns||[];render()}catch{$('list').innerHTML='<div class="empty">Não foi possível carregar agora.</div>'}}
function render(){const q=$('search').value.trim().toLowerCase(),f=campaigns.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.keywords||[]).join(' ').toLowerCase().includes(q));$('total').textContent=campaigns.length;$('active').textContent=campaigns.filter(c=>c.active).length;$('paused').textContent=campaigns.filter(c=>!c.active).length;if(!f.length){$('list').innerHTML='<div class="empty">Nenhuma campanha encontrada.</div>';return}$('list').innerHTML=f.map(c=>`<article class="card"><div class="row"><div class="title">${esc(c.name)}</div><div class="switch ${c.active?'on':''}" onclick="toggle('${c.id}')"></div></div><div class="chips">${(c.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div class="msg">${esc(c.message)}</div>${c.url?`<div class="url">🔗 ${esc(c.url)}</div>`:''}<div class="actions"><button class="mini" onclick="edit('${c.id}')">Editar</button><button class="mini" onclick="duplicate('${c.id}')">Duplicar</button><button class="mini" onclick="removeCampaign('${c.id}')">Excluir</button></div></article>`).join('')}
function clearForm(){['campaignId','name','keywords','message','url'].forEach(id=>$(id).value='');$('pdf').value='';$('fileStatus').textContent='Nenhum PDF selecionado.';$('activeInput').checked=true}
function openNew(){clearForm();$('formTitle').textContent='Nova campanha';$('modal').classList.add('show')}
function edit(id){const c=campaigns.find(x=>x.id===id);if(!c)return;clearForm();$('formTitle').textContent='Editar campanha';$('campaignId').value=c.id;$('name').value=c.name;$('keywords').value=(c.keywords||[]).join(', ');$('message').value=c.message;$('url').value=c.url||'';$('activeInput').checked=!!c.active;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('pdf').addEventListener('change',()=>{$('fileStatus').textContent=$('pdf').files[0]?`PDF selecionado: ${$('pdf').files[0].name}`:'Nenhum PDF selecionado.'});
async function uploadPdf(){const file=$('pdf').files[0];if(!file)return null;const fd=new FormData();fd.append('file',file);$('fileStatus').textContent='Enviando PDF...';const r=await fetch(FILE_API,{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no PDF');$('fileStatus').textContent='PDF enviado e link gerado.';return d.url}
async function saveCampaign(){const btn=$('saveBtn');btn.disabled=true;btn.textContent='Salvando...';try{let finalUrl=$('url').value.trim();const uploaded=await uploadPdf();if(uploaded)finalUrl=uploaded;const body={id:$('campaignId').value||undefined,name:$('name').value.trim(),keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),message:$('message').value.trim(),url:finalUrl,active:$('activeInput').checked};if(!body.name||!body.keywords.length||!body.message)throw new Error('Preencha nome, palavra-chave e mensagem');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível salvar');closeModal();toast('Campanha salva');await load()}catch(e){toast(e.message||'Erro ao salvar')}finally{btn.disabled=false;btn.textContent='Salvar campanha'}}
async function toggle(id){const c=campaigns.find(x=>x.id===id);if(!c)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...c,active:!c.active})});await load()}
async function duplicate(id){const c=campaigns.find(x=>x.id===id);if(!c)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...c,id:undefined,name:c.name+' - cópia'})});toast('Campanha duplicada');await load()}
async function removeCampaign(id){if(!confirm('Excluir esta campanha?'))return;await fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE'});toast('Campanha excluída');await load()}load();
</script></body></html>
