<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FDCA01">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Automação Crediti">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Automação Crediti</title>
<style>
:root{--y:#FDCA01;--ink:#171717;--muted:#707070;--bg:#f5f6f8;--line:#e3e3e3;--green:#238b57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;max-width:100%;min-height:100%;overflow-x:hidden;background:var(--bg);overscroll-behavior-x:none}
body{font-family:Arial,sans-serif;color:var(--ink);touch-action:pan-y}
button,input,textarea{font:inherit}
.app{width:100%;max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(8px + env(safe-area-inset-top)) 10px calc(82px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:9px;margin:0 0 10px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#171717;overflow:hidden}.logo img{width:100%;height:100%;display:block}.brand h1{font-size:18px;line-height:1.05;margin:0;font-weight:800}.brand p{font-size:10.5px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}.stat{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px}.stat b{display:block;font-size:18px;line-height:1}.stat span{display:block;margin-top:4px;font-size:10px;color:var(--muted)}
.head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;margin-bottom:7px}.head h2{font-size:15px;margin:0;white-space:nowrap}.search{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;outline:none;font-size:13px}
.list{display:grid;gap:7px}.card{width:100%;min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:15px;font-weight:800;min-width:0;overflow-wrap:anywhere}.chips{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0}.chip{background:#f2f2f2;border-radius:999px;padding:5px 8px;font-size:10.5px;font-weight:700}.msg{font-size:12.5px;line-height:1.38;color:#3f3f3f;white-space:pre-line;overflow-wrap:anywhere}.url{font-size:10.5px;line-height:1.3;margin-top:7px;color:#555;white-space:normal;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.mini{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:11.5px;font-weight:800}.switch{width:40px;height:23px;border-radius:99px;background:#d7d7d7;position:relative;flex:0 0 40px}.switch:after{content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;background:#fff;border-radius:50%;box-shadow:0 2px 5px #0002}.switch.on{background:var(--green)}.switch.on:after{left:20px}
.fab{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));background:var(--y);border:0;border-radius:14px;padding:12px 14px;font-weight:900;font-size:12.5px;box-shadow:0 8px 20px #0002;z-index:20}.top>.primary{display:none}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50;overflow:hidden}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:430px;max-height:90dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:13px 13px calc(20px + env(safe-area-inset-bottom))}.grab{width:40px;height:4px;border-radius:9px;background:#ddd;margin:0 auto 10px}.sheet h3{font-size:17px;margin:0 0 10px}.field{margin:9px 0}.field label{display:block;font-size:11.5px;font-weight:800;margin-bottom:5px}.field input,.field textarea{display:block;width:100%;max-width:100%;padding:10px 11px;border:1px solid #d8d8d8;border-radius:10px;outline:none;background:#fff;font-size:13px}.field textarea{min-height:86px;resize:vertical}.hint,.file-status{font-size:10.5px;color:var(--muted);margin-top:4px}.upload{border:1.5px dashed #c8c8c8;border-radius:12px;padding:10px;background:#fafafa}.upload input{border:0;padding:4px 0;background:transparent}.forms{display:grid;grid-template-columns:1fr 1.25fr;gap:7px;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 12px;font-weight:800;font-size:12.5px}.primary{background:var(--y);color:#111}.light{background:#fff;border:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 24px);background:#111;color:#fff;padding:9px 11px;border-radius:10px;font-size:11.5px;display:none;z-index:70}.toast.show{display:block}.empty{text-align:center;background:#fff;border:1px dashed #ccc;border-radius:13px;padding:20px 10px;color:var(--muted);font-size:12px}
iframe[src*="netlify"],a[href*="netlify.com"],[data-netlify-deploy-notification],[data-netlify-badge],[class*="netlify-badge"],[id*="netlify-badge"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
@media(min-width:700px){.app{max-width:760px;padding-left:18px;padding-right:18px}.sheet{max-width:620px}.top>.primary{display:block;margin-left:auto}.fab{display:none}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo"><img src="/icon.svg" alt="Automação Crediti"></div><div><h1>Automação Crediti</h1><p>Campanhas do Instagram</p></div></div><button class="btn primary" onclick="openNew()">+ Nova campanha</button></header>
<section class="stats"><div class="stat"><b id="total">0</b><span>Campanhas</span></div><div class="stat"><b id="active">0</b><span>Ativas</span></div><div class="stat"><b id="paused">0</b><span>Pausadas</span></div></section>
<div class="head"><h2>Suas campanhas</h2><input id="search" class="search" placeholder="Buscar" oninput="render()"></div>
<section id="list" class="list"><div class="empty">Carregando campanhas...</div></section>
</main>
<button class="fab" onclick="openNew()">+ Nova campanha</button>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><div class="grab"></div><h3 id="formTitle">Nova campanha</h3><input id="campaignId" type="hidden">
<div class="field"><label>Nome da campanha</label><input id="name" placeholder="Ex.: FGTS Setembro"></div>
<div class="field"><label>Palavras-chave</label><input id="keywords" placeholder="Ex.: FGTS, saque, antecipação"><div class="hint">Separe por vírgula. Pode colocar quantas quiser.</div></div>
<div class="field"><label>Mensagem automática</label><textarea id="message" placeholder="Escreva o que vai chegar no Direct."></textarea></div>
<div class="field"><label>Link opcional</label><input id="url" placeholder="Google Drive, site ou outro endereço"><div class="hint">Você pode usar um link externo ou subir o PDF abaixo.</div></div>
<div class="field upload"><label>Subir PDF direto no Automação Crediti</label><input id="pdf" type="file" accept="application/pdf,.pdf"><div id="fileStatus" class="file-status">Nenhum PDF selecionado.</div></div>
<div class="field"><label><input id="activeInput" type="checkbox" checked> Campanha ativa</label></div>
<div class="forms"><button class="btn light" onclick="closeModal()">Cancelar</button><button id="saveBtn" class="btn primary" onclick="saveCampaign()">Salvar campanha</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='/.netlify/functions/campaigns',FILE_API='/.netlify/functions/campaign-file';let campaigns=[];const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function purgeNetlify(root=document){try{root.querySelectorAll('*').forEach(el=>{const text=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();const href=(el.getAttribute?.('href')||'').toLowerCase();const src=(el.getAttribute?.('src')||'').toLowerCase();const idc=((el.id||'')+' '+(el.className||'')).toLowerCase();const netlify=text.includes('powered by netlify')||href.includes('netlify.com')||src.includes('netlify')||idc.includes('netlify-badge');if(netlify){const cs=getComputedStyle(el);const r=el.getBoundingClientRect();if(cs.position==='fixed'||cs.position==='sticky'||text.includes('powered by netlify')||(r.width<460&&r.height<220)){el.remove();return}}if(el.shadowRoot)purgeNetlify(el.shadowRoot)})}catch{}}
const observer=new MutationObserver(()=>purgeNetlify());observer.observe(document.documentElement,{childList:true,subtree:true});[0,250,800,1800,3500].forEach(ms=>setTimeout(()=>purgeNetlify(),ms));
async function load(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();campaigns=d.campaigns||[];render()}catch{$('list').innerHTML='<div class="empty">Não foi possível carregar agora.</div>'}}
function render(){const q=$('search').value.trim().toLowerCase(),f=campaigns.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.keywords||[]).join(' ').toLowerCase().includes(q));$('total').textContent=campaigns.length;$('active').textContent=campaigns.filter(c=>c.active).length;$('paused').textContent=campaigns.filter(c=>!c.active).length;if(!f.length){$('list').innerHTML='<div class="empty">Nenhuma campanha encontrada.</div>';return}$('list').innerHTML=f.map(c=>`<article class="card"><div class="row"><div class="title">${esc(c.name)}</div><div class="switch ${c.active?'on':''}" onclick="toggle('${c.id}')"></div></div><div class="chips">${(c.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div class="msg">${esc(c.message)}</div>${c.url?`<div class="url">🔗 ${esc(c.url)}</div>`:''}<div class="actions"><button class="mini" onclick="edit('${c.id}')">Editar</button><button class="mini" onclick="duplicate('${c.id}')">Duplicar</button><button class="mini" onclick="removeCampaign('${c.id}')">Excluir</button></div></article>`).join('')}
function clearForm(){['campaignId','name','keywords','message','url'].forEach(id=>$(id).value='');$('pdf').value='';$('fileStatus').textContent='Nenhum PDF selecionado.';$('activeInput').checked=true}
function openNew(){clearForm();$('formTitle').textContent='Nova campanha';$('modal').classList.add('show');document.body.style.overflow='hidden'}
function edit(id){const c=campaigns.find(x=>x.id===id);if(!c)return;clearForm();$('formTitle').textContent='Editar campanha';$('campaignId').value=c.id;$('name').value=c.name;$('keywords').value=(c.keywords||[]).join(', ');$('message').value=c.message;$('url').value=c.url||'';$('activeInput').checked=!!c.active;$('modal').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){$('modal').classList.remove('show');document.body.style.overflow=''}
$('pdf').addEventListener('change',()=>{$('fileStatus').textContent=$('pdf').files[0]?`PDF selecionado: ${$('pdf').files[0].name}`:'Nenhum PDF selecionado.'});
async function uploadPdf(){const file=$('pdf').files[0];if(!file)return null;const fd=new FormData();fd.append('file',file);$('fileStatus').textContent='Enviando PDF...';const r=await fetch(FILE_API,{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no PDF');$('fileStatus').textContent='PDF enviado e link gerado.';return d.url}
async function saveCampaign(){const btn=$('saveBtn');btn.disabled=true;btn.textContent='Salvando...';try{let finalUrl=$('url').value.trim();const uploaded=await uploadPdf();if(uploaded)finalUrl=uploaded;const body={id:$('campaignId').value||undefined,name:$('name').value.trim(),keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),message:$('message').value.trim(),url:finalUrl,active:$('activeInput').checked};if(!body.name||!body.keywords.length||!body.message)throw new Error('Preencha nome, palavra-chave e mensagem');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível salvar');closeModal();toast('Campanha salva');await load()}catch(e){toast(e.message||'Erro ao salvar')}finally{btn.disabled=false;btn.textContent='Salvar campanha'}}
async function toggle(id){const c=campaigns.find(x=>x.id===id);if(!c)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...c,active:!c.active})});await load()}
async function duplicate(id){const c=campaigns.find(x=>x.id===id);if(!c)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...c,id:undefined,name:c.name+' - cópia'})});toast('Campanha duplicada');await load()}
async function removeCampaign(id){if(!confirm('Excluir esta campanha?'))return;await fetch(API+'?id='+encodeURIComponent(id),{method:'DELETE'});toast('Campanha excluída');await load()}
load();
</script>
</body>
</html>
